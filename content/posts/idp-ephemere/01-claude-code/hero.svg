<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Un agent de code encadré par quatre garde-fous : règles, garde-fous exécutables, carte du dépôt, revues">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1222"/>
      <stop offset="100%" style="stop-color:#1a2744"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3d9ee5"/>
      <stop offset="100%" style="stop-color:#7c5cbf"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <text x="600" y="62" fill="#8aa4c4" font-size="14" letter-spacing="0.2em">UNE IDP ÉPHÉMÈRE, PLAN PAR PLAN — ÉPISODE 1</text>
    <rect x="490" y="160" width="220" height="80" rx="40" fill="#101a30" stroke="url(#accent)" stroke-width="2"/>
    <text x="600" y="198" fill="#e6eefa" font-size="20" font-weight="600">Claude Code</text>
    <text x="600" y="222" fill="#8aa4c4" font-size="13">agent de code</text>
    <g stroke="#3d9ee5" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.8">
      <path d="M560 160 L420 125"/><path d="M640 160 L780 125"/>
      <path d="M560 240 L420 275"/><path d="M640 240 L780 275"/>
    </g>
    <g fill="#101a30" stroke="url(#accent)" stroke-width="1.5">
      <rect x="160" y="90" width="260" height="70" rx="8"/>
      <rect x="780" y="90" width="260" height="70" rx="8"/>
      <rect x="160" y="240" width="260" height="70" rx="8"/>
      <rect x="780" y="240" width="260" height="70" rx="8"/>
    </g>
    <g fill="#e6eefa" font-size="17" font-weight="600">
      <text x="290" y="122">Règles écrites</text>
      <text x="910" y="122">Garde-fous testés</text>
      <text x="290" y="272">Carte du dépôt</text>
      <text x="910" y="272">Revues à coût borné</text>
    </g>
    <g fill="#8aa4c4" font-size="13">
      <text x="290" y="145">CLAUDE.md · PLAN.md · ADR</text>
      <text x="910" y="145">permissions · hooks · make test</text>
      <text x="290" y="295">Graphify · local · 0 token</text>
      <text x="910" y="295">/code-review · CI OIDC sans clé</text>
    </g>
    <text x="600" y="355" fill="#8aa4c4" font-size="13">vite, mais sur les rails — et sans facture surprise</text>
  </g>
</svg>
