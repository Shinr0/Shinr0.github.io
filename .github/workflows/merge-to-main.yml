name: Merge to main workflows

# run when a commit is pushed to "source" branch
on:
  push:
    branches:
    - main
  # Bouton « Run workflow » : redéployer sans commit (ex. article programmé à une date future)
  workflow_dispatch:

jobs:
  deploy-to-gh-pages:
    runs-on: ubuntu-latest
    steps:
    # checkout to the commit that has been pushed
    - uses: actions/checkout@v6

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3.0.0
      with:
        hugo-version: '0.169.0'
        extended: true

    - name: Install Dart Sass
      env:
        DART_SASS_VERSION: 1.108.0
      run: |
        curl -fsSL "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"

    - name: Update Hugo Modules
      run: hugo mod tidy

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 18

    - name: Install node modules
      run: |
        hugo mod npm pack
        npm install

    - name: Build
      run: hugo --minify

    # push the generated content into the `gh-pages` branch.
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4.0.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./public
        cname: romain-capelle.cloud
